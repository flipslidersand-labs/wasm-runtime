name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/rust-test.yml@main
    with:
      clippy-args: "--all-targets"
      test-args: "--all"
      coverage-threshold: 80 # 実測(2026-09-21) 90.09%。段階引き上げ余地を残して初期値を設定
      runner: ubuntu-latest

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.65.0
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Remove lock file for MSRV compatibility
        run: rm -f Cargo.lock

      - name: check (MSRV)
        run: cargo check

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: audit
        run: cargo audit

  reviewdog:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/reviewdog-rust.yml@main
