name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/rust-test.yml@b79c88ce85af852181f14442c0875a0680faab73 # main (2026-11-08)
    with:
      clippy-args: "--all-targets"
      test-args: "--all"
      coverage-threshold: 80 # 実測(2026-09-21) 90.09%。段階引き上げ余地を残して初期値を設定
      runner: ${{ vars.GATE_RUNNER }}

  msrv:
    runs-on: ${{ vars.GATE_RUNNER }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.65.0
        uses: dtolnay/rust-toolchain@1.65.0

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Remove lock file for MSRV compatibility
        run: rm -f Cargo.lock

      - name: check (MSRV)
        run: cargo check

  audit:
    runs-on: ${{ vars.GATE_RUNNER }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: audit
        run: cargo audit

  reviewdog:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/reviewdog-rust.yml@b79c88ce85af852181f14442c0875a0680faab73 # main (2026-11-08)
