version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    ignore:
      # ref がそのまま Rust のバージョン指定を兼ねる。bump すると存在しない版 (例: 1.120.0) で msrv が壊れる
      - dependency-name: "dtolnay/rust-toolchain"
